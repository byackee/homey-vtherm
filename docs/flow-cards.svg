<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940"><rect width="1480" height="940" fill="#ffffff"/><text x="40" y="52" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Flow cards</text><text x="40" y="84" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="400" fill="#78838f" text-anchor="start">Everything the app exposes to your Flows, on the two devices it adds.</text><rect x="40" y="110" width="440" height="44" rx="10" fill="#EFF5FE" stroke="#2C7BE5" stroke-width="2.5"/><text x="60" y="139" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#2C7BE5" text-anchor="start">WHEN</text><text x="44" y="184" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">THERMOSTAT</text><rect x="40" y="198" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="198" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="235" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">It starts calling for heat</text><rect x="40" y="270" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="270" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="307" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">It stops calling for heat</text><rect x="40" y="342" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="342" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="379" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">An open window is detected</text><rect x="40" y="414" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="414" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="451" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The window is closed again</text><rect x="40" y="486" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="486" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="515" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The room sensor goes quiet</text><text x="62" y="536" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">the battery is probably dead</text><text x="44" y="590" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">CENTRAL CONFIGURATION</text><rect x="40" y="604" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="604" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="641" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The boiler is started</text><rect x="40" y="676" width="440" height="62" rx="10" fill="#ffffff" stroke="#dbe8fa" stroke-width="2"/><rect x="40" y="676" width="5" height="62" rx="2.5" fill="#2C7BE5"/><text x="62" y="713" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The boiler is stopped</text><rect x="520" y="110" width="440" height="44" rx="10" fill="#FFF7EA" stroke="#C77700" stroke-width="2.5"/><text x="540" y="139" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#C77700" text-anchor="start">AND</text><text x="524" y="184" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">THERMOSTAT</text><rect x="520" y="198" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="198" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="227" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The preset is / is not …</text><text x="542" y="248" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">frost, eco, comfort, boost</text><rect x="520" y="270" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="270" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="307" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">A window is / is not detected open</text><rect x="520" y="342" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="342" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="379" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">It is / is not calling for heat</text><rect x="520" y="414" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="414" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="451" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Someone is / is not home</text><text x="524" y="518" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">CENTRAL CONFIGURATION</text><rect x="520" y="532" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="532" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="569" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The boiler is / is not running</text><rect x="520" y="604" width="440" height="62" rx="10" fill="#ffffff" stroke="#f3e2c8" stroke-width="2"/><rect x="520" y="604" width="5" height="62" rx="2.5" fill="#C77700"/><text x="542" y="641" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">The central mode is / is not …</text><rect x="1000" y="110" width="440" height="44" rx="10" fill="#EEF8F2" stroke="#2A9D5C" stroke-width="2.5"/><text x="1020" y="139" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#2A9D5C" text-anchor="start">THEN</text><text x="1004" y="184" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">THERMOSTAT</text><rect x="1000" y="198" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="198" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="227" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Set the preset</text><text x="1022" y="248" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">frost, eco, comfort, boost, none</text><rect x="1000" y="270" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="270" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="299" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Set the preset for a while</text><text x="1022" y="320" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">and it comes back on its own</text><rect x="1000" y="342" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="342" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="379" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Cancel the timed preset</text><rect x="1000" y="414" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="414" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="451" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Set the target temperature</text><rect x="1000" y="486" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="486" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="515" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Ignore the window detection</text><text x="1022" y="536" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">on / off</text><rect x="1000" y="558" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="558" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="587" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Force the presence state</text><text x="1022" y="608" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">home / away</text><rect x="1000" y="630" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="630" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="659" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Tune the proportional algorithm</text><text x="1022" y="680" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">indoor and outdoor coefficients</text><text x="1004" y="734" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="700" fill="#9aa4b0" text-anchor="start">CENTRAL CONFIGURATION</text><rect x="1000" y="748" width="440" height="62" rx="10" fill="#ffffff" stroke="#d6ecdf" stroke-width="2"/><rect x="1000" y="748" width="5" height="62" rx="2.5" fill="#2A9D5C"/><text x="1022" y="777" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="500" fill="#1f2933" text-anchor="start">Set the central mode</text><text x="1022" y="798" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#8a94a0" text-anchor="start">everything off, heating only, frost</text><rect x="40" y="856" width="1400" height="56" rx="10" fill="#fbfcfd" stroke="#e3e8ec" stroke-width="2"/><text x="66" y="891" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Each card belongs to a device: a room's thermostat, or the single Central configuration device that drives the boiler.</text></svg>