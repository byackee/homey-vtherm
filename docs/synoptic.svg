<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1050" viewBox="0 0 1560 1050"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b0"/></marker></defs><rect width="1560" height="1050" fill="#ffffff"/><text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT IT WATCHES</text><rect x="40" y="64" width="250" height="78" rx="12" fill="#f5f7f9" stroke="#E8590C" stroke-width="2.5"/><text x="165" y="96" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Room sensor</text><text x="165" y="122" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">required</text><rect x="40" y="170" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="204" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Outdoor temperature</text><rect x="40" y="236" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="270" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Window contact</text><rect x="40" y="302" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="336" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Motion</text><rect x="40" y="368" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="402" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Presence</text><text x="165" y="452" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">every one of these is optional</text><text x="350" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT SETS THE TARGET</text><rect x="350" y="64" width="300" height="390" rx="12" fill="#fff6f0" stroke="#E8590C" stroke-width="2.5"/><text x="500" y="100" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">First rule that applies</text><text x="382" y="140" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">1   Off</text><text x="382" y="178" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">2   Central mode</text><text x="382" y="216" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">3   Open window</text><text x="382" y="254" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">4   Safety — sensor gone quiet</text><text x="382" y="292" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">5   Away — nobody home</text><text x="382" y="330" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">6   Activity — motion seen</text><text x="382" y="368" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">7   The preset you chose</text><text x="500" y="428" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">it wins, and it sets the target</text><path d="M 292 103 L 348 110" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 197 L 348 197" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 263 L 348 263" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 329 L 348 329" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 395 L 348 395" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="700" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">TWO REGULATORS, NOT ONE</text><rect x="700" y="64" width="340" height="220" rx="12" fill="#fff6f0" stroke="#E8590C" stroke-width="2.5"/><text x="870" y="98" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Setpoint offset</text><text x="870" y="122" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">for a heater you give a temperature to</text><line x1="730" y1="140" x2="1010" y2="140" stroke="#dfe5ea" stroke-width="1.5"/><text x="870" y="168" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">e = target − room</text><text x="870" y="196" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">offset = kp·e + ki·Σe·dt</text><text x="870" y="220" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">+ k·(room − outdoor)</text><text x="870" y="252" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="700" fill="#E8590C" text-anchor="middle">the heater gets target + offset</text><text x="870" y="274" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#78838f" text-anchor="middle">needs an outdoor sensor — five strengths, or off</text><rect x="700" y="310" width="340" height="230" rx="12" fill="#fff6f0" stroke="#E8590C" stroke-width="2.5"/><text x="870" y="344" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Power</text><text x="870" y="368" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">how hard to heat, every cycle</text><line x1="730" y1="386" x2="1010" y2="386" stroke="#dfe5ea" stroke-width="1.5"/><text x="870" y="414" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">k₁ · (target − room)</text><text x="870" y="438" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">+ k₂ · (target − outdoor)</text><text x="870" y="468" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">kept between 0 and 100 %</text><text x="870" y="498" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">0 % once the room overshoots,</text><text x="870" y="520" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#78838f" text-anchor="middle">and sooner if it is already falling</text><path d="M 652 170 L 696 150" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 652 340 L 696 380" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="1090" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT THE HEATER IS TOLD</text><rect x="1090" y="64" width="430" height="115" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1305" y="102" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Heater with a target</text><text x="1305" y="132" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">target + offset</text><text x="1305" y="158" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">so its own valve stops closing early</text><rect x="1090" y="215" width="430" height="115" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1305" y="253" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Radiator valve</text><text x="1305" y="283" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">the power, as an opening</text><text x="1305" y="309" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">needs the built-in Zigbee2MQTT link</text><rect x="1090" y="366" width="430" height="115" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1305" y="404" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Plain on/off switch</text><text x="1305" y="434" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">the power becomes time</text><text x="1305" y="460" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">30 % → 3 min on, 7 min off, repeat</text><path d="M 1042 200 L 1086 121" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 1042 400 L 1086 272" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 1042 445 L 1086 423" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="350" y="600" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">AND THE BOILER, IF YOU HAVE ONE</text><rect x="350" y="620" width="1170" height="215" rx="12" fill="#fff0ea" stroke="#E8590C" stroke-width="2.5"/><text x="935" y="662" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">It follows what the emitters are actually doing</text><text x="935" y="694" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">not the calculation — the valve's real opening, the relay's real state, or what the heater reports</text><line x1="410" y1="716" x2="1460" y2="716" stroke="#e8cfc1" stroke-width="1.5"/><text x="935" y="752" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">at least one room heating  →  boiler ON</text><text x="935" y="784" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">none  →  boiler OFF, with no delay at all</text><text x="935" y="814" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">and never switched twice inside the same minute</text><path d="M 1305 485 L 1305 618" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="40" y="600" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">THE RHYTHM</text><rect x="40" y="620" width="270" height="215" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="175" y="662" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Recalculated</text><text x="175" y="692" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">every 10 seconds,</text><text x="175" y="716" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#78838f" text-anchor="middle">and the moment a sensor moves</text><line x1="70" y1="738" x2="280" y2="738" stroke="#dfe5ea" stroke-width="1.5"/><text x="175" y="770" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Sent to the heater only</text><text x="175" y="794" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">when the value really changed</text><text x="175" y="820" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#78838f" text-anchor="middle">quiet radio, longer battery life</text><rect x="40" y="875" width="1480" height="145" rx="12" fill="#fbfcfd" stroke="#e3e8ec" stroke-width="2.5"/><text x="70" y="913" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Two things worth knowing</text><text x="70" y="951" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">A radiator valve measures the radiator, not the room. Left alone it reads warm and shuts early — that is the gap the offset closes.</text><text x="70" y="983" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">The boiler is never held back on the way off: one running against closed valves builds pressure, so shutting down is always immediate.</text></svg>