<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b0"/></marker></defs><rect width="1520" height="1000" fill="#ffffff"/><text x="40" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT IT WATCHES</text><rect x="40" y="64" width="250" height="78" rx="12" fill="#f5f7f9" stroke="#E8590C" stroke-width="2.5"/><text x="165" y="96" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Room sensor</text><text x="165" y="122" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">required</text><rect x="40" y="170" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="204" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Outdoor temperature</text><rect x="40" y="236" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="270" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Window contact</text><rect x="40" y="302" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="336" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Motion</text><rect x="40" y="368" width="250" height="54" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="165" y="402" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">Presence</text><text x="165" y="452" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">every one of these is optional</text><text x="360" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT SETS THE TARGET</text><rect x="360" y="64" width="300" height="390" rx="12" fill="#fff6f0" stroke="#E8590C" stroke-width="2.5"/><text x="510" y="100" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">First rule that applies</text><text x="392" y="140" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">1   Off</text><text x="392" y="178" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">2   Central mode</text><text x="392" y="216" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">3   Open window</text><text x="392" y="254" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">4   Safety — sensor gone quiet</text><text x="392" y="292" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">5   Away — nobody home</text><text x="392" y="330" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">6   Activity — motion seen</text><text x="392" y="368" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">7   The preset you chose</text><text x="510" y="428" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="400" fill="#78838f" text-anchor="middle">it wins, and it sets the target</text><path d="M 292 103 L 358 110" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 197 L 358 197" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 263 L 358 263" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 329 L 358 329" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M 292 395 L 358 395" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="730" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">HOW HARD TO HEAT</text><rect x="730" y="170" width="270" height="200" rx="12" fill="#fff6f0" stroke="#E8590C" stroke-width="2.5"/><text x="865" y="208" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Proportional</text><text x="865" y="248" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">k₁ × (target − room)</text><text x="865" y="276" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">+ k₂ × (room − outdoor)</text><line x1="760" y1="296" x2="970" y2="296" stroke="#dfe5ea" stroke-width="1.5"/><text x="865" y="330" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="700" fill="#E8590C" text-anchor="middle">one number, 0 → 100 %</text><text x="865" y="356" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">recomputed every cycle</text><path d="M 662 259 L 728 265" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="1080" y="44" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">WHAT THE HEATER IS TOLD</text><rect x="1080" y="64" width="400" height="100" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1280" y="98" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Heater with a setpoint</text><text x="1280" y="126" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">a corrected target temperature</text><text x="1280" y="150" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">high enough that its own valve stays open</text><path d="M 1002 270 L 1078 114" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1080" y="190" width="400" height="100" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1280" y="224" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Radiator valve</text><text x="1280" y="252" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">the percentage, sent as-is</text><text x="1280" y="276" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">needs the built-in Zigbee2MQTT link</text><path d="M 1002 270 L 1078 240" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1080" y="316" width="400" height="100" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="1280" y="350" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Plain on/off switch</text><text x="1280" y="378" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="middle">the percentage becomes time</text><text x="1280" y="402" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">30 % → 3 min on, 7 min off, repeat</text><path d="M 1002 270 L 1078 366" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="360" y="550" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">AND THE BOILER, IF YOU HAVE ONE</text><rect x="360" y="570" width="1120" height="210" rx="12" fill="#fff0ea" stroke="#E8590C" stroke-width="2.5"/><text x="920" y="612" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle">Every room answers one question: am I calling for heat?</text><text x="920" y="646" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#78838f" text-anchor="middle">the central device counts the rooms that say yes</text><line x1="420" y1="668" x2="1420" y2="668" stroke="#e8cfc1" stroke-width="1.5"/><text x="920" y="704" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">enough of them  →  boiler ON</text><text x="920" y="736" font-family="Helvetica Neue, Helvetica, Arial" font-size="18" font-weight="400" fill="#1f2933" text-anchor="middle">not one  →  boiler OFF, with no delay at all</text><text x="920" y="764" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">and never switched twice inside the same minute</text><path d="M 865 372 L 865 568" stroke="#9aa4b0" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="40" y="550" font-family="Helvetica Neue, Helvetica, Arial" font-size="15" font-weight="700" fill="#78838f" text-anchor="start">THE RHYTHM</text><rect x="40" y="570" width="270" height="210" rx="12" fill="#f5f7f9" stroke="#ccd4dc" stroke-width="2.5"/><text x="175" y="612" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="middle">Recalculated</text><text x="175" y="644" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">every 10 seconds,</text><text x="175" y="670" font-family="Helvetica Neue, Helvetica, Arial" font-size="14" font-weight="400" fill="#78838f" text-anchor="middle">and the moment a sensor moves</text><line x1="70" y1="692" x2="280" y2="692" stroke="#dfe5ea" stroke-width="1.5"/><text x="175" y="724" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">Sent to the heater only</text><text x="175" y="750" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="400" fill="#1f2933" text-anchor="middle">when the value really changed</text><text x="175" y="772" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="400" fill="#78838f" text-anchor="middle">quiet radio, longer battery life</text><rect x="40" y="820" width="1440" height="140" rx="12" fill="#fbfcfd" stroke="#e3e8ec" stroke-width="2.5"/><text x="70" y="858" font-family="Helvetica Neue, Helvetica, Arial" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Two things worth knowing</text><text x="70" y="896" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">A radiator valve measures the radiator, not the room. Left alone it reads warm and shuts early — that is the gap this app closes.</text><text x="70" y="928" font-family="Helvetica Neue, Helvetica, Arial" font-size="17" font-weight="400" fill="#1f2933" text-anchor="start">The boiler is never held back on the way off: one running against closed valves builds pressure, so shutting down is always immediate.</text></svg>