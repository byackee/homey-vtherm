<!-- Vue de pairing générée à la main : elle liste les appareils Homey d'une capability
     donnée pour que l'utilisateur en désigne un comme source du thermostat. -->
<script type="text/javascript" src="/homey.js" data-origin="pair"></script>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 16px; color: #1f2933; }
    h2 { font-size: 17px; margin: 0 0 4px; }
    p.lead { font-size: 13px; color: #62707d; margin: 0 0 16px; line-height: 1.45; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border: 1px solid #dfe4e8; border-radius: 10px; padding: 11px 13px; margin-bottom: 8px;
         cursor: pointer; display: flex; align-items: center; gap: 11px; transition: border-color .12s; }
    li:hover { border-color: #b9c2ca; }
    li.selected { border-color: #E8590C; background: #fff6f0; }
    li .radio { width: 17px; height: 17px; border-radius: 50%; border: 2px solid #c3cbd2; flex: 0 0 auto; }
    li.selected .radio { border-color: #E8590C; border-width: 5px; }
    li .body { min-width: 0; }
    li .name { font-size: 14px; font-weight: 600; }
    li .meta { font-size: 12px; color: #7b8794; margin-top: 2px; }
    .skip { font-size: 13px; color: #62707d; text-align: center; margin-top: 14px; }
    .skip a { color: #E8590C; text-decoration: none; cursor: pointer; }
    .empty { border: 1px dashed #dfe4e8; border-radius: 10px; padding: 20px; text-align: center;
             color: #7b8794; font-size: 13px; line-height: 1.5; }
</style>

<h2 data-i18n="pair.room_sensor.title"></h2>
<p class="lead" data-i18n="pair.room_sensor.lead"></p>
<div id="list"></div>


<script type="text/javascript">
    var SELECT_EVENT = 'select_room_sensor';

    var selected = null;

    function render(devices, allowNone, noneLabel) {
      var root = document.getElementById('list');
      if (!devices.length) {
        root.innerHTML = '';
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = Homey.__('pair.empty');
        root.appendChild(e);
        return;
      }
      var ul = document.createElement('ul');
      if (allowNone) devices = [{ id: null, name: noneLabel, zoneName: null }].concat(devices);
      devices.forEach(function (d) {
        var li = document.createElement('li');
        li.onclick = function () { choose(d, li); };
        var r = document.createElement('div'); r.className = 'radio';
        var b = document.createElement('div'); b.className = 'body';
        var n = document.createElement('div'); n.className = 'name'; n.textContent = d.name;
        b.appendChild(n);
        if (d.zoneName) {
          var m = document.createElement('div'); m.className = 'meta'; m.textContent = d.zoneName;
          b.appendChild(m);
        }
        li.appendChild(r); li.appendChild(b);
        ul.appendChild(li);
      });
      root.innerHTML = '';
      root.appendChild(ul);
    }

    function choose(device, li) {
      selected = device;
      var items = document.querySelectorAll('#list li');
      for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
      li.classList.add('selected');
      Homey.emit(SELECT_EVENT, device.id).catch(function (err) { Homey.alert(err.message || String(err)); });
      Homey.setNavigationNext(true);
    }

    function onHomeyReady(Homey) {
      window.Homey = Homey;
      Homey.setNavigationNext(false);
      Homey.emit('list_candidates', { capability: 'measure_temperature' })
        .then(function (devices) {
          render(devices, false, '');
          Homey.ready();
        })
        .catch(function (err) {
          Homey.alert(err.message || String(err));
          Homey.ready();
        });
    }
</script>
