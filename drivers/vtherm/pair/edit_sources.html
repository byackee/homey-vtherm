<!-- Édition des sources d'un thermostat déjà créé. Sert la réparation Homey : une seule page
     qui montre ce qui est lié aujourd'hui et permet de changer n'importe laquelle des six sources. -->
<style>
    /* Portée limitée à cette vue : le document est partagé avec les autres vues du driver. */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 16px; color: #1f2933; }
    h2 { font-size: 17px; margin: 0 0 4px; }
    p.lead { font-size: 13px; color: #62707d; margin: 0 0 16px; line-height: 1.45; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { border: 1px solid #dfe4e8; border-radius: 10px; padding: 11px 13px; margin-bottom: 8px;
         cursor: pointer; display: flex; align-items: center; gap: 11px; }
    li.selected { border-color: #E8590C; background: #fff6f0; }
    li .radio { width: 17px; height: 17px; border-radius: 50%; border: 2px solid #c3cbd2; flex: 0 0 auto; }
    li.selected .radio { border-color: #E8590C; border-width: 5px; }
    li .name { font-size: 14px; font-weight: 600; }
    li .meta { font-size: 12px; color: #7b8794; margin-top: 2px; }
    .state { border: 1px dashed #dfe4e8; border-radius: 10px; padding: 18px; text-align: center;
             color: #7b8794; font-size: 13px; line-height: 1.5; }
    .state.error { border-color: #f0b6b6; background: #fff5f5; color: #a12727; text-align: left;
                   white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace;
                   font-size: 12px; }
    button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
             background: #E8590C; border: 0; border-radius: 9px; cursor: pointer; margin-top: 6px; }
    section { margin-bottom: 22px; }
    h3 { font-size: 14px; margin: 0 0 3px; }
    p.hint { font-size: 12px; color: #7b8794; margin: 0 0 9px; line-height: 1.45; }

    .required { font-size: 11px; color: #a12727; text-transform: uppercase; letter-spacing: .04em;
                margin-right: 4px; }
    button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
             background: #E8590C; border: 0; border-radius: 9px; cursor: pointer; margin-top: 6px; }
</style>

<h2 data-i18n="pair.edit.title"></h2>
<p class="lead" data-i18n="pair.edit.lead"></p>
<div id="edit_sources-state" class="state">…</div>

<section><h3 data-i18n="pair.edit.room"></h3>
  <p class="hint"><span class="required" data-i18n="pair.edit.required"></span><span data-i18n="pair.edit.room_hint"></span></p>
  <div id="edit_sources-room"></div></section>
<section><h3 data-i18n="pair.edit.emitter"></h3>
  <p class="hint"><span class="required" data-i18n="pair.edit.required"></span><span data-i18n="pair.edit.emitter_hint"></span></p>
  <div id="edit_sources-emitter"></div></section>
<section><h3 data-i18n="pair.optional.outdoor"></h3>
  <p class="hint" data-i18n="pair.optional.outdoor_hint"></p><div id="edit_sources-outdoor"></div></section>
<section><h3 data-i18n="pair.optional.window"></h3>
  <p class="hint" data-i18n="pair.optional.window_hint"></p><div id="edit_sources-window"></div></section>
<section><h3 data-i18n="pair.optional.motion"></h3>
  <p class="hint" data-i18n="pair.optional.motion_hint"></p><div id="edit_sources-motion"></div></section>
<section><h3 data-i18n="pair.optional.presence"></h3>
  <p class="hint" data-i18n="pair.optional.presence_hint"></p><div id="edit_sources-presence"></div></section>

<button type="button" id="edit_sources-finish" data-i18n="pair.done"></button>

<script type="text/javascript">
(function () {
    /** Les vues d'un même driver partagent le document : chaque identifiant porte le sien. */
    var PREFIX = 'edit_sources-';
    // Les deux premières sources sont obligatoires : sans mesure de pièce ni émetteur, il n'y a
    // rien à réguler. Elles n'ont donc pas d'option « Aucun ».
    var VIEW = { slots: [
      { key: 'room',     event: 'select_room_sensor', required: true },
      { key: 'emitter',  event: 'select_emitter',     required: true },
      { key: 'outdoor',  event: 'select_outdoor' },
      { key: 'window',   event: 'select_window' },
      { key: 'motion',   event: 'select_motion' },
      { key: 'presence', event: 'select_presence' }
    ] };

    /** Ce qui est lié aujourd'hui, pour montrer d'où l'on part. */
    var CURRENT = {};

      var H = null;
      /** 'pair' ou 'repair'. Les mêmes vues servent aux deux, et elles ne doivent pas agir pareil. */
      var MODE = 'pair';
  
      function report(message) {
        try { if (H && H.emit) H.emit('viewLog', String(message)); } catch (e) { /* rien à faire */ }
      }
  
      window.addEventListener('error', function (event) {
        report('erreur JS : ' + (event && event.message));
        showError('' + (event && event.message));
      });
  
      function showError(message) {
        var box = document.getElementById(PREFIX + 'state');
        if (!box) return;
        box.className = 'state error';
        box.textContent = message;
        box.style.display = '';
      }
  
      function showText(message) {
        var box = document.getElementById(PREFIX + 'state');
        if (!box) return;
        box.className = 'state';
        box.textContent = message;
        box.style.display = '';
      }
  
      function hideState() {
        var box = document.getElementById(PREFIX + 'state');
        if (box) box.style.display = 'none';
      }
  
      /** `Homey.emit` est tantôt à promesse, tantôt à callback selon le contexte. On accepte les deux. */
      function emit(event, data) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          function ok(v) { if (!settled) { settled = true; resolve(v); } }
          function ko(e) { if (!settled) { settled = true; reject(e instanceof Error ? e : new Error(String(e))); } }
          try {
            var returned = H.emit(event, data, function (err, result) {
              if (err) ko(err); else ok(result);
            });
            if (returned && typeof returned.then === 'function') returned.then(ok, ko);
          } catch (e) { ko(e); }
        });
      }
  
      /** Traduction : `data-i18n` n'est pas garanti d'être appliqué, on le fait nous-mêmes. */
      function translate() {
        if (!H || typeof H.__ !== 'function') return;
        var nodes = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < nodes.length; i++) {
          var key = nodes[i].getAttribute('data-i18n');
          var text = H.__(key);
          if (text && text !== key) nodes[i].textContent = text;
        }
      }
  
      function label(key, fallback) {
        if (H && typeof H.__ === 'function') {
          var t = H.__(key);
          if (t && t !== key) return t;
        }
        return fallback;
      }
  
      /**
       * Passe à l'étape suivante.
       *
       * Il n'existe AUCUN moyen de griser le bouton « Suivant » depuis une vue de pairing :
       * `setNavigationNext` n'existe pas dans l'objet Homey — vérifié contre la documentation
       * officielle, les mocks communautaires et les apps publiées. Les apps réelles avancent donc
       * à la sélection, ce que fait cette vue. Le driver refuse de toute façon de créer un
       * thermostat sans capteur ni émetteur, donc rien ne dépend d'un bouton qu'on ne contrôle pas.
       */
      function goNext() {
        try {
          if (H && typeof H.nextView === 'function') H.nextView();
        } catch (e) { report('nextView : ' + e.message); }
      }
  
      function buildItem(device, onPick) {
        var li = document.createElement('li');
        li.onclick = function () { onPick(li); };
        var r = document.createElement('div'); r.className = 'radio';
        var b = document.createElement('div');
        var n = document.createElement('div'); n.className = 'name'; n.textContent = device.name;
        b.appendChild(n);
        if (device.zoneName) {
          var m = document.createElement('div'); m.className = 'meta'; m.textContent = device.zoneName;
          b.appendChild(m);
        }
        li.appendChild(r); li.appendChild(b);
        return li;
      }
  
  
    function boot(homey) {
        if (H) return;                 // déjà démarré par l'autre convention
        H = homey || window.Homey;
        if (!H) { showError('Objet Homey introuvable dans cette vue.'); return; }
        try {
          translate();
          // Le mode est demandé EN PARALLÈLE, jamais en amont : il ne sert qu'au moment du clic, et
          // enchaîner le chargement de la liste derrière lui ferait dépendre l'affichage d'un
          // aller-retour de plus. Une vue qui n'affiche rien tant qu'une question secondaire n'a pas
          // répondu, c'est la panne qu'on vient de corriger.
          emit('pair_mode', null)
            .then(function (mode) { MODE = (mode === 'repair') ? 'repair' : 'pair'; })
            .catch(function () { MODE = 'pair'; })
            .then(wireFinishButton);
          start();
        } catch (e) {
          report('démarrage : ' + e.message);
          showError('Démarrage de la vue impossible : ' + e.message);
        }
        try { if (typeof H.ready === 'function') H.ready(); } catch (e) { /* facultatif */ }
      }

    function renderSlot(slot, devices) {
      var root = document.getElementById(PREFIX + slot.key);
      if (!root) return;
      root.innerHTML = '';
      var ul = document.createElement('ul');
      var all = (devices || []).slice();
      if (!slot.required) {
        all.unshift({ id: null, name: label('pair.optional.none', 'Aucun'), zoneName: null });
      }
      all.forEach(function (d) {
        var li = buildItem(d, function (node) {
          var items = root.querySelectorAll('li');
          for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
          node.classList.add('selected');
          // Appliqué immédiatement : le driver re-lie la source et la régulation repart dessus
          // au tick suivant. Rien à valider, rien à créer — on modifie un appareil existant.
          emit(slot.event, d.id)
            .then(function () { showText(label('pair.updated', 'Modification enregistrée.')); })
            .catch(function (err) { showError(err.message); });
        });
        var isCurrent = (d.id === CURRENT[slot.key]) || (d.id === null && !CURRENT[slot.key]);
        if (isCurrent) li.classList.add('selected');
        ul.appendChild(li);
      });
      root.appendChild(ul);
    }

    function start() {
      showText('…');
      emit('current_sources', null)
        .then(function (current) { CURRENT = current || {}; })
        .catch(function () { CURRENT = {}; })
        .then(function () {
          return Promise.all(VIEW.slots.map(function (s) {
            return emit('list_candidates', { source: s.key })
              .then(function (devices) { renderSlot(s, devices); })
              .catch(function (err) {
                report('list_candidates(' + s.key + ') : ' + err.message);
                renderSlot(s, []);
              });
          }));
        })
        .then(hideState)
        .catch(function (err) { showError(err.message); });

      var button = document.getElementById(PREFIX + 'finish');
      if (button) button.onclick = function () { if (typeof H.done === 'function') H.done(); };
    }

    var previousReady = window.onHomeyReady;
    window.onHomeyReady = function (homey) {
      if (typeof previousReady === 'function') previousReady(homey);
      boot(homey);
    };
    if (typeof Homey !== 'undefined' && Homey) { boot(Homey); }
    else {
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof Homey !== 'undefined' && Homey) boot(Homey);
      });
    }
})();
</script>
