<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .lead { font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
    .lead-list { font-size: 13px; line-height: 1.5; margin: 0 0 18px; padding-left: 20px; }
    .hint { font-size: 12px; color: #6b7280; margin: 4px 0 0; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: none; }
    .dot.on { background: #2ea043; }
    .dot.off { background: #d1242f; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .message { font-size: 13px; line-height: 1.5; min-height: 18px; margin-top: 12px; }
    .message.error { color: #b91c1c; }
    .message.ok { color: #1a7f37; }
    .message.warn { color: #b45309; }

    /* Onglets. Deux sujets sans rapport — les thermostats et l'accès au broker — cohabitaient
       sur une page qu'il fallait parcourir en entier pour trouver l'un ou l'autre. */
    .tabs { display: flex; gap: 4px; margin: 0 0 18px; border-bottom: 1px solid #dfe4e8; }
    .tab { appearance: none; border: 0; background: none; padding: 10px 14px; font-size: 14px;
           font-weight: 600; color: #62707d; cursor: pointer; border-bottom: 2px solid transparent;
           margin-bottom: -1px; }
    .tab:hover { color: #1f2933; }
    .tab[aria-selected="true"] { color: #E8590C; border-bottom-color: #E8590C; }
    .panel[hidden] { display: none; }

    .room-title { font-size: 13px; font-weight: 700; text-transform: uppercase;
                  letter-spacing: .06em; color: #7b8794; margin: 20px 0 8px;
                  padding-bottom: 5px; border-bottom: 1px solid #eceff1; }
    .room-title:first-of-type { margin-top: 4px; }

    .section-title { font-size: 17px; font-weight: 700; margin: 26px 0 4px; }
    .section-title:first-of-type { margin-top: 0; }

    /* Un thermostat et ses six sources. Le cadre sert à ne pas confondre deux thermostats. */
    .tstat { border: 1px solid #dfe4e8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .tstat-name { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
    .src { margin-bottom: 12px; }
    .src:last-child { margin-bottom: 0; }
    .src-label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
    .src-required { font-size: 10px; color: #a12727; text-transform: uppercase; letter-spacing: .04em;
                    font-weight: 700; margin-left: 6px; }
    .src-select { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px;
                  color: #1f2933; background: #fff; border: 1px solid #c3cbd2; border-radius: 8px; }
    .src-select:disabled { background: #f3f4f6; color: #7b8794; }
    /* Un identifiant orphelin doit sauter aux yeux : c'est la panne que cette page existe pour corriger. */
    .src.is-missing .src-select { border-color: #d1242f; background: #fff5f5; }
    .hint.danger { color: #b91c1c; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab" id="tab-sources" role="tab" aria-controls="panel-sources"
            aria-selected="true" data-panel="sources" data-i18n="settings.tab.sources"></button>
    <button type="button" class="tab" id="tab-backbone" role="tab" aria-controls="panel-backbone"
            aria-selected="false" data-panel="backbone" data-i18n="settings.tab.backbone"></button>
  </nav>

  <div class="panel" id="panel-sources" role="tabpanel" aria-labelledby="tab-sources">
  <!-- Les sources d'abord : c'est ce que l'utilisateur ne trouvait pas ailleurs. La réparation de
       Homey continue d'exister et fait exactement la même chose ; elle est simplement introuvable. -->
  <h2 class="section-title" data-i18n="settings.sources.title"></h2>
  <p class="lead" data-i18n="settings.sources.lead"></p>
  <div id="thermostats"></div>
  <p class="message" id="sourcesMessage"></p>
  <div class="actions">
    <button class="homey-button-secondary-full" id="reloadSources" data-i18n="settings.sources.refresh"></button>
  </div>
  </div>

  <div class="panel" id="panel-backbone" role="tabpanel" aria-labelledby="tab-backbone" hidden>
  <h2 class="section-title" data-i18n="settings.backbone_title"></h2>
  <p class="lead" data-i18n="settings.backbone_subtitle"></p>
  <p class="lead" data-i18n="settings.lead"></p>
  <ul class="lead-list">
    <li data-i18n="settings.lead_valve"></li>
    <li data-i18n="settings.lead_sensor"></li>
  </ul>
  <p class="lead" data-i18n="settings.lead_without"></p>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">…</span>
  </div>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.broker"></legend>

    <div class="homey-form-group">
      <label class="homey-form-checkbox">
        <input type="checkbox" id="enabled" />
        <span class="homey-form-checkmark"></span>
        <span class="homey-form-checkbox-text" data-i18n="settings.enabled"></span>
      </label>
      <p class="hint" data-i18n="settings.enabled_hint"></p>
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="host" data-i18n="settings.host"></label>
      <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.50"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
      <p class="hint" data-i18n="settings.host_hint"></p>
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="port" data-i18n="settings.port"></label>
      <input class="homey-form-input" id="port" type="number" value="1883" min="1" max="65535" />
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="username" data-i18n="settings.username"></label>
      <input class="homey-form-input" id="username" type="text"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
      <p class="hint" data-i18n="settings.username_hint"></p>
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="password" data-i18n="settings.password"></label>
      <input class="homey-form-input" id="password" type="password" autocomplete="new-password" />
      <p class="hint" id="passwordHint"></p>
      <label class="hint" id="clearPasswordRow" style="display:none">
        <input type="checkbox" id="clearPassword" />
        <span data-i18n="settings.password_clear"></span>
      </label>
    </div>

    <div class="homey-form-group">
      <label class="homey-form-label" for="baseTopic" data-i18n="settings.base_topic"></label>
      <input class="homey-form-input" id="baseTopic" type="text" placeholder="zigbee2mqtt"
        autocapitalize="off" autocorrect="off" spellcheck="false" />
      <p class="hint" data-i18n="settings.base_topic_hint"></p>
    </div>
  </fieldset>

  <div class="actions">
    <button class="homey-button-primary-full" id="save" data-i18n="settings.save"></button>
    <button class="homey-button-secondary-full" id="test" data-i18n="settings.test"></button>
  </div>
  <p class="message" id="message"></p>
  </div>

  <script type="text/javascript">
    /**
     * Onglets.
     *
     * Les deux sujets de cette page n'ont rien à voir : les appareils d'un thermostat d'un côté,
     * l'accès au broker Zigbee2MQTT de l'autre. Les empiler obligeait à parcourir l'un pour
     * atteindre l'autre. Les panneaux restent dans le DOM et ne sont que masqués : le code qui
     * les remplit n'a pas à savoir lequel est visible.
     */
    function showPanel(name) {
      var tabs = document.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) {
        var selected = tabs[i].getAttribute('data-panel') === name;
        tabs[i].setAttribute('aria-selected', selected ? 'true' : 'false');
      }
      var panels = document.querySelectorAll('.panel');
      for (var j = 0; j < panels.length; j++) {
        panels[j].hidden = panels[j].id !== 'panel-' + name;
      }
    }

    function wireTabs() {
      var tabs = document.querySelectorAll('.tab');
      for (var i = 0; i < tabs.length; i++) {
        (function (tab) {
          tab.addEventListener('click', function () {
            showPanel(tab.getAttribute('data-panel'));
          });
        })(tabs[i]);
      }
    }

    /**
     * Une erreur JavaScript non rattrapée laissait cette page à moitié vide, sans un mot. Elle
     * s'écrit désormais dedans : une page de réglages muette est indébogable à distance.
     */
    window.addEventListener('error', function (event) {
      const box = document.getElementById('sourcesMessage');
      if (!box) return;
      box.className = 'message error';
      box.textContent = 'JavaScript : ' + ((event && event.message) || 'erreur inconnue');
    });

    function onHomeyReady(Homey) {
      const $ = id => document.getElementById(id);

      // Avant tout le reste : si le chargement des données échoue, les onglets doivent rester
      // utilisables — l'onglet du broker n'a aucune raison de tomber avec celui des thermostats.
      wireTabs();
      const DEFAULT_PORT = 1883;
      const DEFAULT_BASE_TOPIC = 'zigbee2mqtt';

      /**
       * Le mot de passe n'est jamais relu : l'API ne le renvoie pas, et ce champ reste vide même
       * quand un mot de passe est enregistré. Laisser vide conserve celui qui est stocké.
       */
      let hasPassword = false;

      /** `Homey.api` est à callback. Tout le reste de cette page raisonne en promesses. */
      function api(method, path, body) {
        return new Promise((resolve, reject) => {
          Homey.api(method, path, body, (err, result) => {
            if (err) reject(err instanceof Error ? err : new Error((err && err.message) || String(err)));
            else resolve(result);
          });
        });
      }

      // --- Sources des thermostats ------------------------------------------

      /**
       * Les six sources, dans l'ordre de la page de réparation.
       *
       * Les libellés sont ceux du pairing : deux écrans qui nomment différemment la même chose se
       * lisent comme deux fonctions différentes. Capteur de pièce et émetteur n'ont pas d'option
       * « Aucun » — sans eux il n'y a rien à réguler, et l'API refuserait de toute façon.
       */
      const SOURCES = [
        { key: 'room', label: 'pair.edit.room', required: true },
        { key: 'emitter', label: 'pair.edit.emitter', required: true },
        { key: 'outdoor', label: 'pair.optional.outdoor' },
        { key: 'window', label: 'pair.optional.window' },
        { key: 'motion', label: 'pair.optional.motion' },
        { key: 'presence', label: 'pair.optional.presence' },
      ];

      function setSourcesMessage(text, kind) {
        $('sourcesMessage').textContent = text || '';
        $('sourcesMessage').className = 'message' + (kind ? ' ' + kind : '');
      }

      /** Nom de l'appareil tel qu'il doit apparaître dans la liste : « Sonde » ou « Sonde — Salon ». */
      function deviceLabel(device) {
        if (!device || !device.name) return '';
        return device.zoneName ? device.name + ' — ' + device.zoneName : device.name;
      }

      function paintMissing(row, hint, view) {
        const missing = view && view.missing === true;
        row.classList.toggle('is-missing', missing);
        hint.className = 'hint danger';
        hint.textContent = missing
          ? Homey.__('settings.sources.missing', { id: view.deviceId })
          : '';
        hint.style.display = missing ? '' : 'none';
      }

      /**
       * Une source : son libellé, ce qui est lié aujourd'hui, et de quoi en changer.
       *
       * Aucun bouton « enregistrer » : le changement part au choix, comme dans la page de
       * réparation. `candidates` vaut `null` quand la liste n'a pas pu être lue — le menu est
       * alors désactivé plutôt que vide, pour ne pas laisser croire qu'aucun appareil n'existe.
       */
      function buildSource(thermostat, spec, view, candidates) {
        const row = document.createElement('div');
        row.className = 'src';

        const label = document.createElement('label');
        label.className = 'src-label';
        label.textContent = Homey.__(spec.label);
        if (spec.required) {
          const badge = document.createElement('span');
          badge.className = 'src-required';
          badge.textContent = Homey.__('pair.edit.required');
          label.appendChild(badge);
        }
        row.appendChild(label);

        const select = document.createElement('select');
        select.className = 'src-select';

        const options = [];
        if (!spec.required) options.push({ id: '', text: Homey.__('pair.optional.none') });

        const list = Array.isArray(candidates) ? candidates : [];
        const known = view.deviceId !== null && list.some(d => d.id === view.deviceId);
        // Un identifiant orphelin n'est dans aucune liste. Sans son option, le menu afficherait
        // un autre appareil et mentirait sur ce qui est réellement lié.
        if (view.deviceId !== null && !known) {
          options.push({
            id: view.deviceId,
            text: view.deviceName
              ? deviceLabel(view)
              : Homey.__('settings.sources.orphan_option', { id: view.deviceId }),
          });
        }
        list.forEach(d => options.push({ id: d.id, text: deviceLabel(d) }));

        options.forEach(option => {
          const node = document.createElement('option');
          node.value = option.id;
          node.textContent = option.text;
          select.appendChild(node);
        });

        select.value = view.deviceId === null ? '' : view.deviceId;
        select.disabled = candidates === null;
        row.appendChild(select);

        const hint = document.createElement('p');
        row.appendChild(hint);
        paintMissing(row, hint, view);

        if (candidates === null) {
          const warning = document.createElement('p');
          warning.className = 'hint';
          warning.textContent = Homey.__('settings.sources.unavailable');
          row.appendChild(warning);
        }

        let previous = select.value;
        select.addEventListener('change', () => {
          const chosen = select.value === '' ? null : select.value;
          select.disabled = true;
          setSourcesMessage(Homey.__('settings.sources.saving'));

          api('PUT', '/thermostats/source', {
            deviceId: thermostat.id,
            source: spec.key,
            sourceDeviceId: chosen,
          }).then(updated => {
            select.disabled = false;
            previous = select.value;
            paintMissing(row, hint, updated);
            setSourcesMessage(Homey.__('pair.updated'), 'ok');
          }).catch(err => {
            select.disabled = false;
            // Un refus doit se voir : le menu revient à ce qui est réellement lié.
            select.value = previous;
            setSourcesMessage(err.message || String(err), 'error');
          });
        });

        return row;
      }

      function buildThermostat(thermostat, candidates) {
        const box = document.createElement('div');
        box.className = 'tstat';

        const name = document.createElement('p');
        name.className = 'tstat-name';
        name.textContent = thermostat.name;
        box.appendChild(name);

        const views = Array.isArray(thermostat.sources) ? thermostat.sources : [];
        SOURCES.forEach(spec => {
          const view = views.filter(v => v.source === spec.key)[0]
            || { source: spec.key, deviceId: null, deviceName: null, zoneName: null, missing: false };
          box.appendChild(buildSource(thermostat, spec, view, candidates[spec.key]));
        });

        return box;
      }

      function renderThermostats(data, candidates) {
        const root = $('thermostats');
        root.textContent = '';

        const list = (data && Array.isArray(data.thermostats)) ? data.thermostats : [];
        if (list.length === 0) {
          // Un cadre vide n'apprend rien : on dit quoi faire pour en avoir un.
          const empty = document.createElement('p');
          empty.className = 'hint';
          empty.textContent = Homey.__('settings.sources.empty');
          root.appendChild(empty);
          setSourcesMessage('');
          return;
        }

        // Regroupés par pièce. Avec cinq ou dix thermostats, une liste à plat oblige à lire le
        // détail de chacun pour retrouver celui qu'on cherche. La pièce retenue est celle du
        // CAPTEUR : c'est lui qui définit le volume d'air régulé, pas l'émetteur — un radiateur
        // peut être déclaré dans une pièce voisine sans que ça change ce qui est chauffé.
        const byRoom = new Map();
        list.forEach(thermostat => {
          const room = thermostat.sources.find(s => s.source === 'room');
          const zone = (room && room.zoneName) || Homey.__('settings.sources.no_room');
          if (!byRoom.has(zone)) byRoom.set(zone, []);
          byRoom.get(zone).push(thermostat);
        });

        [...byRoom.keys()].sort((a, b) => a.localeCompare(b)).forEach(zone => {
          const heading = document.createElement('h3');
          heading.className = 'room-title';
          heading.textContent = zone;
          root.appendChild(heading);
          byRoom.get(zone)
            .sort((a, b) => String(a.name).localeCompare(String(b.name)))
            .forEach(thermostat => root.appendChild(buildThermostat(thermostat, candidates)));
        });

        // Sans le hub, aucun nom n'a pu être résolu : le dire vaut mieux que d'afficher six
        // identifiants bruts sans explication.
        if (data.hubConnected === true) setSourcesMessage('');
        else setSourcesMessage(Homey.__('settings.sources.hub_offline'), 'warn');
      }

      function loadSources() {
        setSourcesMessage(Homey.__('settings.sources.loading'));
        $('reloadSources').disabled = true;

        // Les candidats ne dépendent que du TYPE de source, pas du thermostat : six appels pour
        // toute la page, quel que soit le nombre de thermostats. Le quota de l'API Homey n'est
        // pas une vue de l'esprit.
        const lists = SOURCES.map(spec =>
          api('GET', '/candidates?source=' + encodeURIComponent(spec.key))
            .then(devices => Array.isArray(devices) ? devices : [])
            .catch(() => null));

        Promise.all([api('GET', '/thermostats'), Promise.all(lists)]).then(results => {
          $('reloadSources').disabled = false;
          const candidates = {};
          SOURCES.forEach((spec, index) => { candidates[spec.key] = results[1][index]; });
          renderThermostats(results[0], candidates);
        }).catch(err => {
          $('reloadSources').disabled = false;
          $('thermostats').textContent = '';
          setSourcesMessage(
            Homey.__('settings.sources.failed', { detail: err.message || String(err) }), 'error');
        });
      }

      // --- Dorsale Zigbee2MQTT ----------------------------------------------

      function setMessage(text, kind) {
        $('message').textContent = text;
        $('message').className = 'message' + (kind ? ' ' + kind : '');
      }

      function renderStatus(status) {
        const enabled = status.enabled === true;
        const available = status.available;
        $('dot').className = 'dot ' + (enabled && available === true ? 'on' : (enabled ? 'off' : ''));
        if (!enabled) {
          $('statusText').textContent = Homey.__('settings.state_disabled');
        } else if (available === true) {
          $('statusText').textContent = Homey.__('settings.state_connected');
        } else if (available === false) {
          $('statusText').textContent = Homey.__('settings.state_disconnected');
        } else {
          $('statusText').textContent = Homey.__('settings.state_unknown');
        }
      }

      function renderPasswordHint() {
        $('passwordHint').textContent = hasPassword
          ? Homey.__('settings.password_stored')
          : Homey.__('settings.password_hint');
        // Sans ce moyen d'effacer, un mot de passe enregistré ne partait qu'avec l'app : la page
        // annonçait « un mot de passe est enregistré » sans rien offrir pour s'en défaire.
        $('clearPasswordRow').style.display = hasPassword ? '' : 'none';
        if (!hasPassword) $('clearPassword').checked = false;
      }

      function fill(status) {
        $('enabled').checked = status.enabled === true;
        $('host').value = status.host || '';
        $('port').value = status.port || DEFAULT_PORT;
        $('username').value = status.username || '';
        $('baseTopic').value = status.baseTopic || DEFAULT_BASE_TOPIC;
        hasPassword = status.hasPassword === true;
        renderPasswordHint();
        renderStatus(status);
      }

      function currentFields() {
        const port = parseInt($('port').value, 10);
        return {
          host: $('host').value.trim(),
          port: isNaN(port) ? DEFAULT_PORT : port,
          username: $('username').value.trim(),
          password: $('password').value,
          baseTopic: $('baseTopic').value.trim() || DEFAULT_BASE_TOPIC,
        };
      }

      /** Traduit le diagnostic de `POST /broker/test` en une phrase qui dit quoi corriger. */
      function describeOutcome(result) {
        switch (result && result.status) {
          case 'ok':
            return [Homey.__('settings.test_ok', { count: result.deviceCount }), 'ok'];
          case 'no_devices':
            return [Homey.__('settings.test_no_devices'), 'warn'];
          case 'auth_failed':
            return [Homey.__('settings.test_auth_failed'), 'error'];
          case 'refused':
            return [Homey.__('settings.test_refused', { detail: result.detail || '' }), 'error'];
          case 'timeout':
            return [Homey.__('settings.test_timeout'), 'error'];
          case 'invalid_config':
            // Une adresse qui porte des identifiants mérite mieux qu'un « saisie invalide » :
            // c'est le seul cas où l'utilisateur a écrit quelque chose de plausible, et où on
            // doit lui dire précisément quel champ utiliser à la place.
            return result.detail === 'host_has_credentials'
              ? [Homey.__('settings.test_host_has_credentials'), 'error']
              : [Homey.__('settings.test_invalid_config'), 'error'];
          default:
            return [Homey.__('settings.test_unknown'), 'error'];
        }
      }

      Homey.api('GET', '/broker/status', null, (err, result) => {
        if (err) return setMessage(err.message || String(err), 'error');
        fill(result);
      });

      $('save').addEventListener('click', () => {
        const fields = currentFields();
        setMessage('');
        $('save').disabled = true;

        const writes = [
          ['broker.enabled', $('enabled').checked],
          ['broker.host', fields.host],
          ['broker.port', fields.port],
          ['broker.username', fields.username],
          ['broker.baseTopic', fields.baseTopic],
        ];
        // Un champ vide conserve le mot de passe enregistré : la page ne peut pas le relire pour
        // le réécrire, l'effacer par inadvertance couperait la dorsale sans le dire.
        if (fields.password !== '') writes.push(['broker.password', fields.password]);
        else if ($('clearPassword').checked) writes.push(['broker.password', '']);

        let pending = writes.length;
        let failed = null;
        writes.forEach(([key, value]) => {
          Homey.set(key, value, (setErr) => {
            if (setErr && !failed) failed = setErr;
            if (--pending > 0) return;
            $('save').disabled = false;
            if (failed) return setMessage(failed.message || String(failed), 'error');
            if (fields.password !== '') {
              hasPassword = true;
              $('password').value = '';
              renderPasswordHint();
            } else if ($('clearPassword').checked) {
              hasPassword = false;
              $('clearPassword').checked = false;
              renderPasswordHint();
            }
            setMessage(Homey.__('settings.saved'), 'ok');
            Homey.api('GET', '/broker/status', null, (statusErr, status) => {
              if (!statusErr) renderStatus(status);
            });
          });
        });
      });

      $('test').addEventListener('click', () => {
        setMessage(Homey.__('settings.testing'));
        $('test').disabled = true;

        Homey.api('POST', '/broker/test', currentFields(), (err, result) => {
          $('test').disabled = false;
          if (err) return setMessage(err.message || String(err), 'error');
          const [text, kind] = describeOutcome(result);
          setMessage(text, kind);
        });
      });

      $('reloadSources').addEventListener('click', loadSources);

      // Le chargement des thermostats ne doit jamais empêcher `Homey.ready()` : une page qui ne
      // se déclare pas prête reste blanche, réglages du broker compris.
      try {
        loadSources();
      } catch (err) {
        setSourcesMessage((err && err.message) || String(err), 'error');
      }

      Homey.ready();
    }
  </script>
